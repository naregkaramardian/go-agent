services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: goagent
      POSTGRES_USER: goagent
      POSTGRES_PASSWORD: goagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goagent -d goagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  goagent:
    build: .
    image: goagent:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MEMORY_DSN: postgres://goagent:goagent@postgres:5432/goagent
      LOG_FORMAT: ${LOG_FORMAT:-text}
    stdin_open: true
    tty: true

volumes:
  pgdata:
